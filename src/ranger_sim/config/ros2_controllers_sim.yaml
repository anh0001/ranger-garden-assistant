# ros2_control controller configuration for Gazebo Fortress simulation.
# Matches the real-hardware controller interface so MoveIt configs work unchanged.
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # gz_ros2_control exports the joint8 mimic as "piper_joint8_mimic"; it
    # is broadcast on its own local topic and republished as piper_joint8
    # by mimic_joint_state_relay.py, so /joint_states only carries real
    # joint names (MoveIt logs an error for unknown ones).
    piper_mimic_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    piper_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # GripperCommand on /piper_gripper_controller/gripper_cmd: the same
    # action MoveIt (moveit_controllers.yaml) and the real
    # piper_follow_joint_trajectory_bridge expose. piper_joint8 (second
    # finger) is not a controller target: gz_ros2_control drives it as a
    # mimic of piper_joint7 (see ranger_gazebo.urdf.xacro).
    piper_gripper_controller:
      type: position_controllers/GripperActionController

joint_state_broadcaster:
  ros__parameters:
    joints:
      - piper_joint1
      - piper_joint2
      - piper_joint3
      - piper_joint4
      - piper_joint5
      - piper_joint6
      - piper_joint7
    interfaces:
      - position
      - velocity

piper_mimic_state_broadcaster:
  ros__parameters:
    use_local_topics: true  # -> /piper_mimic_state_broadcaster/joint_states
    joints:
      - piper_joint8_mimic
    interfaces:
      - position
      - velocity

piper_arm_controller:
  ros__parameters:
    joints:
      - piper_joint1
      - piper_joint2
      - piper_joint3
      - piper_joint4
      - piper_joint5
      - piper_joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

piper_gripper_controller:
  ros__parameters:
    joint: piper_joint7
    action_monitor_rate: 20.0
    goal_tolerance: 0.005
    max_effort: 10.0
    # Fingers stopping on the object (or on the attached object) is a
    # successful close, not an abort.
    allow_stalling: true
    stall_velocity_threshold: 0.001
    stall_timeout: 1.0
