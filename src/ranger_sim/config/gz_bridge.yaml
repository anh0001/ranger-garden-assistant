# ros_gz_bridge configuration for Gazebo Fortress simulation.
# Bridges Gazebo topics to/from the ROS 2 topic names expected by the stack.

# Clock (Gazebo -> ROS)
- topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: ignition.msgs.Clock
  direction: GZ_TO_ROS

# Base mobility
- topic_name: /cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: ignition.msgs.Twist
  direction: ROS_TO_GZ

- topic_name: /odom
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: ignition.msgs.Odometry
  direction: GZ_TO_ROS

- topic_name: /tf
  ros_type_name: tf2_msgs/msg/TFMessage
  gz_type_name: ignition.msgs.Pose_V
  direction: GZ_TO_ROS

# World-frame poses of all moving entities (cup, ranger links incl.
# piper_link6). grasp_magnet reads the gripper pose from here so it is
# in the exact same world frame as the cup it repositions.
- ros_topic_name: /gz_world_poses
  gz_topic_name: /world/garden_world/dynamic_pose/info
  ros_type_name: tf2_msgs/msg/TFMessage
  gz_type_name: ignition.msgs.Pose_V
  direction: GZ_TO_ROS

# LiDAR (Gazebo -> ROS)
- topic_name: /scan
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: ignition.msgs.PointCloudPacked
  direction: GZ_TO_ROS

# IMU (Gazebo -> ROS)
- topic_name: /imu/data
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: ignition.msgs.IMU
  direction: GZ_TO_ROS

# Front camera (Gazebo -> ROS)
- topic_name: /camera/image_raw
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: ignition.msgs.Image
  direction: GZ_TO_ROS

- topic_name: /camera/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: ignition.msgs.CameraInfo
  direction: GZ_TO_ROS

# Wrist camera color (Gazebo -> ROS)
- topic_name: /piper/wrist_camera/color/image_raw
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: ignition.msgs.Image
  direction: GZ_TO_ROS

# Wrist camera depth (Gazebo -> ROS)
- topic_name: /piper/wrist_camera/depth/image_rect_raw
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: ignition.msgs.Image
  direction: GZ_TO_ROS

- topic_name: /piper/wrist_camera/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: ignition.msgs.CameraInfo
  direction: GZ_TO_ROS
