# ros_gz_bridge configuration for Gazebo Fortress simulation.
# Bridges Gazebo topics to/from the ROS 2 topic names expected by the stack.

# Clock (Gazebo -> ROS)
- topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: ignition.msgs.Clock
  direction: GZ_TO_ROS

# Base mobility
- topic_name: /cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: ignition.msgs.Twist
  direction: ROS_TO_GZ

- topic_name: /odom
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: ignition.msgs.Odometry
  direction: GZ_TO_ROS

- topic_name: /tf
  ros_type_name: tf2_msgs/msg/TFMessage
  gz_type_name: ignition.msgs.Pose_V
  direction: GZ_TO_ROS

# Navigation 2D LiDAR (Gazebo -> ROS): single-ring gpu_lidar emits a real
# LaserScan on gz /scan; nav2_sim.yaml obstacle_layer consumes this directly.
- topic_name: /scan
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: ignition.msgs.LaserScan
  direction: GZ_TO_ROS

# 3D Livox-approximation cloud (Gazebo -> ROS), perception only, not used
# by the Nav2 costmap. Bridged under a distinct name for visualization.
- ros_topic_name: /lidar_points
  gz_topic_name: /lidar/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: ignition.msgs.PointCloudPacked
  direction: GZ_TO_ROS

# IMU (Gazebo -> ROS)
- topic_name: /imu/data
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: ignition.msgs.IMU
  direction: GZ_TO_ROS

# Front camera (Gazebo -> ROS)
- topic_name: /camera/image_raw
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: ignition.msgs.Image
  direction: GZ_TO_ROS

- topic_name: /camera/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: ignition.msgs.CameraInfo
  direction: GZ_TO_ROS

# Wrist camera color (Gazebo -> ROS)
- topic_name: /piper/wrist_camera/color/image_raw
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: ignition.msgs.Image
  direction: GZ_TO_ROS

# Wrist camera depth (Gazebo -> ROS)
- topic_name: /piper/wrist_camera/depth/image_rect_raw
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: ignition.msgs.Image
  direction: GZ_TO_ROS

- topic_name: /piper/wrist_camera/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: ignition.msgs.CameraInfo
  direction: GZ_TO_ROS

# ---------------------------------------------------------------------
# GRASP SECTION — hand-written, one attach/detach/state triple per object
# in config/graspable_objects.yaml (test/test_grasp_manager.py fails if an
# object is missing here).
# DetachableJoint per object: attach/detach take ignition.msgs.Empty,
# state reports "attached"/"detached". Driven by grasp_manager.py.
# ---------------------------------------------------------------------
- topic_name: /grasp/cup/attach
  ros_type_name: std_msgs/msg/Empty
  gz_type_name: ignition.msgs.Empty
  direction: ROS_TO_GZ
- topic_name: /grasp/cup/detach
