      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

controller_server:  # original: (none); Trajectory controller node handling FollowPath commands.
  ros__parameters:  # original: (none); ROS 2 parameter namespace for this node; adjust values inside this block.
    use_sim_time: False  # original: True; controller runs on real robot time.
    odom_topic: "/fastlio2/lio_odom"  # original: /odom; align controller with FASTLIO2 odometry per repo conventions.
    controller_frequency: 20.0  # original: 20.0; Controller loop frequency; raise for quicker response.
    min_x_velocity_threshold: 0.001  # original: 0.001; Below this linear x velocity commands are forced to zero.
    min_y_velocity_threshold: 0.5  # original: 0.5; tiny threshold fits non-holonomic (no lateral) motion.
    min_theta_velocity_threshold: 0.001  # original: 0.001; Below this angular velocity commands are forced to zero.
    failure_tolerance: 0.3  # original: 0.3; Allowed duration (s) of controller failure before navigation aborts.
    progress_checker_plugin: "progress_checker"  # original: "progress_checker"; Plugin name used to detect robot progress toward goal.
    goal_checker_plugins: ["general_goal_checker"]  # original: ["general_goal_checker"]; List of goal checker plugins available to the controller.
    controller_plugins: ["FollowPath"]  # original: ["FollowPath"]; List of controller plugins to load; order defines priority.
    progress_checker:  # original: (none); Namespace for progress checker parameters.
      plugin: "nav2_controller::SimpleProgressChecker"  # original: "nav2_controller::SimpleProgressChecker"; Fully qualified plugin class implementing this capability.
      required_movement_radius: 0.25  # original: 0.5; tighter progress check since FASTLIO2 odom is accurate.
      movement_time_allowance: 10.0  # original: 10.0; How long the robot may be stationary before progress checker trips.
    general_goal_checker:  # original: (none); Namespace for the default goal checker parameters.
      stateful: True  # original: True; When true the plugin remembers state between goals; turn off for stateless behavior.
      plugin: "nav2_controller::SimpleGoalChecker"  # original: "nav2_controller::SimpleGoalChecker"; Fully qualified plugin class implementing this capability.
      xy_goal_tolerance: 0.25  # original: 0.25; stricter position tolerance for precise docking/row alignment.
      yaw_goal_tolerance: 0.25  # original: 0.25; slightly tighter heading alignment.
    FollowPath:  # original: (none); Namespace for the DWB FollowPath controller parameters.
      plugin: "dwb_core::DWBLocalPlanner"  # original: "dwb_core::DWBLocalPlanner"; Fully qualified plugin class implementing this capability.
      debug_trajectory_details: True  # original: True; Enable verbose logging of sampled trajectories for tuning.
      min_vel_x: 0.0  # original: 0.0; avoid very small commands that don't move the base.
      min_vel_y: 0.0  # original: 0.0; Minimum allowed lateral velocity; keep zero for diff-drive.
      max_vel_x: 0.26  # original: 0.26; higher max speed for outdoor navigation.
      max_vel_y: 0.0  # original: 0.0; Maximum lateral velocity; >0 only for holonomic bases.
      max_vel_theta: 1.0  # original: 1.0; slightly faster rotation acceptable for this platform.
      min_speed_xy: 0.05  # original: 0.0; consistent with non-zero min_vel_x.
      max_speed_xy: 0.26  # original: 0.26; match higher linear speed capability.
      min_speed_theta: 0.0  # original: 0.0; Minimum angular speed considered motion; lower to detect slow rotation.
      acc_lim_x: 0.6  # original: 2.5; gentler acceleration for heavier outdoor robot.
      acc_lim_y: 0.0  # original: 0.0; Maximum allowed lateral acceleration.
      acc_lim_theta: 1.5  # original: 3.2; reduce rotational jerk.
      decel_lim_x: -0.6  # original: -2.5; smoother stopping.
      decel_lim_y: 0.0  # original: 0.0; Maximum allowed lateral deceleration.
      decel_lim_theta: -1.5  # original: -3.2; smoother rotational braking.
      vx_samples: 20  # original: 20; slightly fewer samples to save CPU.
      vy_samples: 5  # original: 5; diff-drive robot so no lateral motion sampling.
      vtheta_samples: 20  # original: 20; Number of angular velocity samples DWB evaluates each cycle.
      sim_time: 1.7  # original: 1.7; longer lookahead to suit higher speeds.
      linear_granularity: 0.05  # original: 0.05; Step distance for simulating trajectories; smaller captures detail.
      angular_granularity: 0.025  # original: 0.025; Angular step for trajectory simulation; smaller resolves slow turns.
      transform_tolerance: 0.2  # original: 0.2; Allowed TF extrapolation window; increase if transforms arrive late.
      xy_goal_tolerance: 0.25  # original: 0.25; tight stop tolerance matching goal checker.
      trans_stopped_velocity: 0.25  # original: 0.25; consider robot stopped at lower speed.
      short_circuit_trajectory_evaluation: True  # original: True; Stop evaluating once a good trajectory is found to save CPU.
      stateful: True  # original: True; When true the plugin remembers state between goals; turn off for stateless behavior.
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]  # original: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]; List of DWB critics that score each trajectory.
      BaseObstacle.scale: 0.02  # original: 0.02; Weight applied to the base obstacle critic; raise to avoid obstacles more aggressively.
      PathAlign.scale: 32.0  # original: 32.0; slightly reduce aggressiveness of path alignment.
      PathAlign.forward_point_distance: 0.1  # original: 0.1; look a bit further ahead on the path.
      GoalAlign.scale: 24.0  # original: 24.0; softer goal alignment weighting.
      GoalAlign.forward_point_distance: 0.1  # original: 0.1; smoother alignment with further lookahead.
      PathDist.scale: 32.0  # original: 32.0; moderate path distance weight.
      GoalDist.scale: 24.0  # original: 24.0; slightly softer attraction to goal.
      RotateToGoal.scale: 32.0  # original: 32.0; slightly less aggressive rotate-in-place behavior.
      RotateToGoal.slowing_factor: 5.0  # original: 5.0; Factor that slows rotation near goal; raise to reduce overshoot.
      RotateToGoal.lookahead_time: -1.0  # original: -1.0; Time horizon (s) used to preview heading when rotating to goal.

local_costmap:  # original: (none); Local rolling costmap configuration block.
  local_costmap:  # original: (none); Local rolling costmap configuration block.
    ros__parameters:  # original: (none); ROS 2 parameter namespace for this node; adjust values inside this block.
      update_frequency: 10.0  # original: 5.0; faster updates for more responsive obstacle avoidance.
      publish_frequency: 5.0  # original: 2.0; publish costmap more often for controllers.
      global_frame: odom  # original: odom; Global frame used by this component; usually map for Nav2.
      robot_base_frame: base_footprint  # original: base_footprint; Robot base frame used for TF lookups; typically base_footprint or base_link.
      use_sim_time: False  # original: True; real robot uses system time.
      rolling_window: true  # original: true; Whether the costmap moves with the robot (true) or stays fixed.
      width: 8  # original: 3; larger local window for outdoor navigation.
      height: 8  # original: 3; larger local window for outdoor navigation.
      resolution: 0.05  # original: 0.05; Costmap resolution (m/cell); lower numbers capture finer detail.
      transform_tolerance: 0.3  # original: default; explicit TF tolerance for FASTLIO2 TF timing.
      robot_radius: 0.42  # original: 0.3; matches larger Ranger chassis for safer clearance.
      plugins: ["voxel_layer", "inflation_layer"]  # original: ["voxel_layer", "inflation_layer"]; Plugin list for this component; order matters for stacking layers.
      inflation_layer:  # original: (none); Inflation layer parameters; buffers obstacles outward.
        plugin: "nav2_costmap_2d::InflationLayer"  # original: "nav2_costmap_2d::InflationLayer"; Fully qualified plugin class implementing this capability.
        cost_scaling_factor: 3.0  # original: 3.0; Controls how quickly inflated cost decays from the obstacle.
        inflation_radius: 0.55  # original: 0.3; trimmed to keep corridor clearance while still buffering outdoors.
      voxel_layer:  # original: (none); Voxel layer parameters for 3D obstacle handling.
        plugin: "nav2_costmap_2d::VoxelLayer"  # original: "nav2_costmap_2d::VoxelLayer"; Fully qualified plugin class implementing this capability.
        enabled: True  # original: True; Enable/disable this block without removing it.
        publish_voxel_map: False  # original: False; enabled for easier debugging of 3D obstacles.
        origin_z: 0.0  # original: 0.05; start voxel grid lower to catch near-ground obstacles.
        z_resolution: 0.1  # original: 0.08; coarser but taller grid to cover 2.4 m corridors without extra CPU.
        z_voxels: 24  # original: 16; extends voxel stack to 2.4 m tall spaces.
        max_obstacle_height: 2.4  # original: 1.8; match typical indoor ceiling while still capturing outdoor obstacles.
        min_obstacle_height: 0.1  # original: not set; drop ground/near-floor returns that were blocking corridors.
        mark_threshold: 0  # original: 0; Voxel occupancy threshold before marking a cell as occupied.
        observation_sources: mid360_cloud  # original: separate marking/clearing sources; here we use a single Livox source.
        mid360_cloud:  # original: (none); Livox Mid-360 pointcloud observation source block.
          topic: /livox/lidar  # original: /livox/lidar; ROS topic supplying data for this plugin.
          max_obstacle_height: 2.4  # original: 1.8; aligned with corridor ceiling height for consistent filtering.
          min_obstacle_height: 0.1  # original: 0.0; ignore ground returns so the corridor floor stays free.
          clearing: True  # original: had separate clearing topic; combined marking+clearing here.
          marking: True  # original: marking-only source; here the same cloud does both.
          data_type: "PointCloud2"  # original: "PointCloud2"; Message type expected (LaserScan vs PointCloud2).
          expected_update_rate: 0.0  # original: 0.0; Expected sensor publish rate (Hz); set 0 to ignore timeouts.; Not set in original; 0 disables timeout checks.
          observation_persistence: 0.0  # original: 0.0; How long (s) to keep obstacles after last seen.; Not set in original; obstacles are cleared as soon as they disappear.
          raytrace_max_range: 20.0  # original: 3.0; leverage long-range Livox data for raytracing.
          raytrace_min_range: 0.2  # original: 0.0; ignore extremely close/noisy returns.
          obstacle_max_range: 15.0  # original: 2.5; detect obstacles farther away outdoors.
          obstacle_min_range: 0.0  # original: 0.0; Minimum range used for obstacle detection.; Same as original but kept explicit.
      always_send_full_costmap: True  # original: True; Publish the entire costmap each cycle instead of tiles.

global_costmap:  # original: (none); Global planning costmap configuration block.
  global_costmap:  # original: (none); Global planning costmap configuration block.
    ros__parameters:  # original: (none); ROS 2 parameter namespace for this node; adjust values inside this block.
      update_frequency: 1.0  # original: 1.0; Update loop frequency for this costmap.
      publish_frequency: 1.0  # original: 1.0; Publish frequency for this costmap topic.
      global_frame: map  # original: map; Global frame used by this component; usually map for Nav2.
      robot_base_frame: base_footprint  # original: base_footprint; Robot base frame used for TF lookups; typically base_footprint or base_link.
      use_sim_time: False  # original: True; global costmap uses real time.
      robot_radius: 0.42  # original: 0.22; larger footprint for Ranger base.
      resolution: 0.05  # original: 0.05; coarser but efficient global map for large outdoor areas.
      track_unknown_space: true  # original: true; Treat unknown cells as occupied so planner skirts unmapped space.
      rolling_window: false  # original: false; Whether the costmap moves with the robot (true) or stays fixed.; Use static map from Octomap projection
      width: 100  # original: 100; Total width (m) of the costmap area.; Large outdoor area coverage (100m x 100m)
      height: 100  # original: 100; Total height (m) of the costmap area.
      origin_x: -50.0  # original: -50.0; X origin (m) of the global costmap in its frame.; Center the costmap around the origin
      origin_y: -50.0  # original: -50.0; Y origin (m) of the global costmap in its frame.
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]  # original: ["static_layer", "obstacle_layer", "inflation_layer"]; Plugin list for this component; order matters for stacking layers.
      obstacle_layer:  # original: (none); Obstacle layer parameters for the global map.
        plugin: "nav2_costmap_2d::ObstacleLayer"  # original: "nav2_costmap_2d::ObstacleLayer"; Fully qualified plugin class implementing this capability.
        enabled: True  # original: True; Enable/disable this block without removing it.
        observation_sources: mid360_cloud  # original: scan_marking/scan_clearing; here we use Livox pointcloud.
        mid360_cloud:  # original: (none); Livox Mid-360 pointcloud observation source block.
          topic: /livox/lidar  # original: /livox/lidar; ROS topic supplying data for this plugin.
          max_obstacle_height: 2.4  # original: 2.0; follow 2.4 m indoor ceiling so walls don’t get clipped.
          min_obstacle_height: 0.1  # original: 0.0; filter ground hits to avoid clogging narrow corridors.
          clearing: True  # original: used dedicated clearing LaserScan; combined here.
          marking: True  # original: marking LaserScan; combined here.
          data_type: "PointCloud2"  # original: LaserScan; global obstacles come from 3D Livox cloud.
          raytrace_max_range: 25.0  # original: 3.0; long-range raytracing for outdoor navigation.
          raytrace_min_range: 0.2  # original: 0.0; ignore very near returns.
          obstacle_max_range: 20.0  # original: 2.5; see obstacles farther ahead.
          obstacle_min_range: 0.0  # original: 0.0; Minimum range used for obstacle detection.; Same as original but kept explicit.
      static_layer:  # original: (none); Static layer parameters combining map data.
        plugin: "nav2_costmap_2d::StaticLayer"  # original: "nav2_costmap_2d::StaticLayer"; Fully qualified plugin class implementing this capability.
        map_subscribe_transient_local: True  # original: True; Use latched QoS to catch latched map updates even when late.
        map_topic: /projected_map  # original: /map; use OctoMap_server2 projected map as Nav2 static layer.
        subscribe_to_updates: True  # original: default false; allow incremental updates from OctoMap.
        first_map_only: False  # original: default true; continue updating static map as it changes.
      inflation_layer:  # original: (none); Inflation layer parameters; buffers obstacles outward.
        plugin: "nav2_costmap_2d::InflationLayer"  # original: "nav2_costmap_2d::InflationLayer"; Fully qualified plugin class implementing this capability.
        cost_scaling_factor: 3.0  # original: 3.0; Controls how quickly inflated cost decays from the obstacle.
        inflation_radius: 0.2  # original: 0.55; balanced for corridor clearance while keeping outdoor buffer.
      always_send_full_costmap: True  # original: True; Publish the entire costmap each cycle instead of tiles.

planner_server:  # original: (none); Global planner server configuration block.
  ros__parameters:  # original: (none); ROS 2 parameter namespace for this node; adjust values inside this block.
    expected_planner_frequency: 20.0  # original: 20.0; Desired global planner run frequency.
    use_sim_time: False  # original: True; planner runs on real-time hardware clock.
    planner_plugins: ["GridBased"]  # original: ["GridBased"]; List of planner plugins to load.
    GridBased:  # original: (none); Grid-based NavFn planner parameters.
      plugin: "nav2_navfn_planner/NavfnPlanner"  # original: "nav2_navfn_planner/NavfnPlanner"; Fully qualified plugin class implementing this capability.
      tolerance: 0.5  # original: 0.5; Planner goal tolerance (m); increase for easier goal acceptance.
      use_astar: false  # original: false; Toggle between NavFn Dijkstra (false) and A* (true).
      allow_unknown: true  # original: true; Allow planner to traverse unknown cells if true.

smoother_server:  # original: (none); Path smoother server configuration block.
  ros__parameters:  # original: (none); ROS 2 parameter namespace for this node; adjust values inside this block.
    use_sim_time: False  # original: True; smoother uses hardware time.
    smoother_plugins: ["simple_smoother"]  # original: ["simple_smoother"]; List of smoother plugins to load.
    simple_smoother:  # original: (none); Simple smoother parameters.
      plugin: "nav2_smoother::SimpleSmoother"  # original: "nav2_smoother::SimpleSmoother"; Fully qualified plugin class implementing this capability.
      tolerance: 1.0e-10  # original: 1.0e-10; Planner goal tolerance (m); increase for easier goal acceptance.
      max_its: 1000  # original: 1000; Maximum iterations smoothing algorithm can run.
      do_refinement: True  # original: True; Run additional refinement pass when true.

behavior_server:  # original: (none); Recoveries/behaviors server configuration block.
  ros__parameters:  # original: (none); ROS 2 parameter namespace for this node; adjust values inside this block.
    costmap_topic: local_costmap/costmap_raw  # original: local_costmap/costmap_raw; Topic name supplying local costmap data to behaviors.
    footprint_topic: local_costmap/published_footprint  # original: local_costmap/published_footprint; Topic name for robot footprint published to behaviors.
    cycle_frequency: 10.0  # original: 10.0; Frequency for running recovery behaviors.
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]  # original: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]; List of behavior plugins available.
    spin:  # original: (none); Spin behavior configuration block.
      plugin: "nav2_behaviors/Spin"  # original: "nav2_behaviors/Spin"; Fully qualified plugin class implementing this capability.
    backup:  # original: (none); Backup behavior configuration block.
      plugin: "nav2_behaviors/BackUp"  # original: "nav2_behaviors/BackUp"; Fully qualified plugin class implementing this capability.
