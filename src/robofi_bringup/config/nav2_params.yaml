amcl:  # original: (none); Adaptive Monte Carlo Localization node configuration root; group of localization parameters to tune.
  ros__parameters:  # original: (none); ROS 2 parameter namespace for this node; adjust values inside this block.
    use_sim_time: False  # original: True; real hardware uses system time instead of /clock.
    alpha1: 0.2  # original: 0.2; Rotational noise from yaw motion; raise if odom rotation is noisy.
    alpha2: 0.2  # original: 0.2; Translational noise caused by rotation; higher values reduce trust in odom when turning.
    alpha3: 0.2  # original: 0.2; Translational noise from forward motion; increase when odom translation is uncertain.
    alpha4: 0.2  # original: 0.2; Rotational noise caused by translation; tune if turns drift when driving straight.
    alpha5: 0.2  # original: 0.2; Strafing motion noise for omni bases; increase when lateral odom is unreliable.
    base_frame_id: "base_footprint"  # original: base_link; this matches map→odom→base_footprint→base_link TF used in this repo.
    beam_skip_distance: 0.5  # original: 0.5; Distance (m) before a beam is considered outlier for skipping; raise to be more tolerant.
    beam_skip_error_threshold: 0.9  # original: 0.9; Probability threshold before enabling beam skipping; lower to skip beams sooner.
    beam_skip_threshold: 0.3  # original: 0.3; Fraction of beams that must agree; raise to ignore more beams when scan is noisy.
    do_beamskip: false  # original: false; Turns beam skipping on/off; disable to consider every beam even if noisy.
    global_frame_id: "map"  # original: "map"; Global frame AMCL publishes to; usually map or localization reference frame.
    lambda_short: 0.1  # original: 0.1; Rate for short readings in sensor model; adjust to match unexpected obstacle frequency.
    laser_likelihood_max_dist: 2.0  # original: 2.0; Max distance used for likelihood field; shorten to ignore far obstacles.
    laser_max_range: 100.0  # original: 100.0; Maximum laser range measurement considered; cap this to drop long-range noise.
    laser_min_range: -1.0  # original: -1.0; Minimum laser range; raise to ignore near-field reflections.
    laser_model_type: "likelihood_field"  # original: "likelihood_field"; Chosen AMCL laser model; likelihood field is best for dense occupancy grids.
    max_beams: 60  # original: 60; Number of beams sampled each update; more beams improve accuracy at extra CPU cost.
    max_particles: 2000  # original: 2000; Max particle count for AMCL; higher improves robustness but costs CPU.
    min_particles: 500  # original: 500; Minimum particle count; lower allows faster updates but may lose track.
    odom_frame_id: "odom"  # original: "odom"; Odometry frame used for motion updates; must match TF tree.
    pf_err: 0.05  # original: 0.05; Adaptive filter error bound; lower forces more particles for accuracy.
    pf_z: 0.99  # original: 0.99; Adaptive filter confidence bound; closer to 1.0 keeps more particles.
    recovery_alpha_fast: 0.0  # original: 0.0; Weight for fast exponential average; increase for quicker recovery after jumps.
    recovery_alpha_slow: 0.0  # original: 0.0; Weight for slow exponential average; lower makes AMCL respond faster.
    resample_interval: 1  # original: 1; How often particles are resampled; >1 skips cycles to save CPU.
    robot_model_type: "nav2_amcl::OmniMotionModel"  # original: "nav2_amcl::OmniMotionModel"; Motion model plugin; pick omni vs diff drive based on platform.
    save_pose_rate: 0.5  # original: 0.5; Frequency (Hz) of saving last pose; raise to survive crashes with fresher pose.
    sigma_hit: 0.2  # original: 0.2; Std dev for accurate hit measurements; lower tightens match with map.
    tf_broadcast: true  # original: true; Whether AMCL publishes map->odom TF; disable if external localization handles TF.
    transform_tolerance: 1.0  # original: 1.0; Allowed TF extrapolation window; increase if transforms arrive late.
    update_min_a: 0.2  # original: 0.2; Minimum rotation (rad) before update; lower sees frequent rotational updates.
    update_min_d: 0.25  # original: 0.25; Minimum translation (m) before update; lower tracks small motions.
    z_hit: 0.5  # original: 0.5; Weight of accurate readings; raise to trust good scan matches.
    z_max: 0.05  # original: 0.05; Weight of max range readings; raise when many beams return max range.
    z_rand: 0.5  # original: 0.5; Weight of random measurements; raise if sensor has random noise.
    z_short: 0.05  # original: 0.05; Weight for unexpectedly short hits; raise when near obstacles dominate.
    scan_topic: scan  # original: scan; Laser scan topic feeding AMCL; change to whichever sensor you localize with.

bt_navigator:  # original: (none); Behavior Tree navigator node; orchestrates Nav2 behaviors.
  ros__parameters:  # original: (none); ROS 2 parameter namespace for this node; adjust values inside this block.
    use_sim_time: False  # original: True; on real hardware we use wall-clock time, not /clock.
    global_frame: map  # original: map; Global frame used by this component; usually map for Nav2.
    robot_base_frame: base_footprint  # original: base_footprint; Robot base frame used for TF lookups; typically base_footprint or base_link.
    odom_topic: /fastlio2/lio_odom  # original: /odom; this repo standardizes Nav2 on FASTLIO2 odometry.
    bt_loop_duration: 10  # original: 10; How often (Hz) the behavior tree ticks; lower numbers slow reactions.
    default_server_timeout: 20  # original: 20; Default timeout for BT actions/services; raise for slow servers.
    wait_for_service_timeout: 10000  # MILLISECONDS (not seconds!). 1000 = only 1.0s: in sim the clear-costmap services aren't discoverable that fast during BT activation, so Humble's BtServiceNode throws and the real error is masked as the cryptic "Exception when loading BT: basic_string::_M_create" (a Nav2 Humble error-string-construction bug). 10000 = 10s tolerates slow sim bringup.
    action_server_result_timeout: 900.0  # original: 900.0; Time before BT gives up waiting on an action result.; Not set in original; allow long outdoor missions before timing out.
    navigators: ["navigate_to_pose", "navigate_through_poses"]  # original: ["navigate_to_pose", "navigate_through_poses"]; List of navigator action servers to start; include pose/waypoint flavors you need.; Explicit navigators; original relies on defaults.
    navigate_to_pose:  # original: (none); Configuration block for the NavigateToPose action server.
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"  # original: "nav2_bt_navigator/NavigateToPoseNavigator"; Fully qualified plugin class implementing this capability.; Explicit plugin; original uses default bt_navigator setup.
    navigate_through_poses:  # original: (none); Configuration block for NavigateThroughPoses action server.
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"  # original: "nav2_bt_navigator/NavigateThroughPosesNavigator"; Fully qualified plugin class implementing this capability.; Explicit plugin for multi-goal navigation.
    plugin_lib_names:  # original: (none); Behavior Tree plugin libraries to load for BT execution.
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

controller_server:  # original: (none); Trajectory controller node handling FollowPath commands.
  ros__parameters:  # original: (none); ROS 2 parameter namespace for this node; adjust values inside this block.
    use_sim_time: False  # original: True; controller runs on real robot time.
    odom_topic: "/fastlio2/lio_odom"  # original: /odom; align controller with FASTLIO2 odometry per repo conventions.
    controller_frequency: 15.0  # LOWERED 20->15. Real-robot bag showed 1777 "Control loop missed 20Hz" warnings over 226s (~50% miss rate) on Jetson Orin. 15Hz still > shim+MPPI replan needs and gives compute headroom; MPPI batch/time_steps also cut (see below).
    min_x_velocity_threshold: 0.001  # original: 0.001; Below this linear x velocity commands are forced to zero.
    min_y_velocity_threshold: 0.001  # original: 0.5; threshold for omnidirectional lateral motion detection.
    min_theta_velocity_threshold: 0.001  # original: 0.001; Below this angular velocity commands are forced to zero.
    failure_tolerance: 0.5  # INCREASED from 0.3 to 0.5s - more tolerant of occasional slow cycles
    progress_checker_plugin: "progress_checker"  # original: "progress_checker"; Plugin name used to detect robot progress toward goal.
    goal_checker_plugins: ["general_goal_checker"]  # original: ["general_goal_checker"]; List of goal checker plugins available to the controller.
    controller_plugins: ["FollowPath"]  # original: ["FollowPath"]; List of controller plugins to load; order defines priority.
    progress_checker:  # original: (none); Namespace for progress checker parameters.
      plugin: "nav2_controller::SimpleProgressChecker"  # original: "nav2_controller::SimpleProgressChecker"; Fully qualified plugin class implementing this capability.
      required_movement_radius: 0.1  # XY-only — SimpleProgressChecker does not count rotation
      movement_time_allowance: 60.0  # 10->60s. CRITICAL FIX: 2nd bag showed robot reached xy_tol then rotated in place toward goal yaw; progress_checker fired "Failed to make progress" because pure rotation has no XY movement, BT then spawned Spin recoveries that timed out (7 recoveries, endless loop). 60s lets the rotation shim finish even if hardware rotates slowly.
    general_goal_checker:  # original: (none); Namespace for the default goal checker parameters.
      stateful: True  # original: True; When true the plugin remembers state between goals; turn off for stateless behavior.
      plugin: "nav2_controller::SimpleGoalChecker"  # original: "nav2_controller::SimpleGoalChecker"; Fully qualified plugin class implementing this capability.
      xy_goal_tolerance: 0.40  # 0.25->0.40. Real bag: reached d<0.5m at t=51s, NEVER reached d<0.25m, spent 85s oscillating in [0.25,0.5). 0.40m lets the rotation shim take over for the final yaw alignment (shim only engages AFTER xy_tol met).
      yaw_goal_tolerance: 0.20  # ~11deg, 0.10->0.20. With shim's deterministic in-place rotation this still gives precise heading; tighter values caused goal-yaw thrashing on hardware.
    FollowPath:  # RotationShimController wrapping MPPI: fast deterministic in-place rotation to the GOAL heading, MPPI for all path travel.
      plugin: "nav2_rotation_shim_controller::RotationShimController"  # Humble binary supports rotate_to_goal_heading (verified against humble branch source).
      primary_controller: "nav2_mppi_controller::MPPIController"  # MPPI still does 100% of path tracking + omnidirectional strafing; shim only intercepts the final yaw alignment.
      # --- Shim behavior ---
      rotate_to_goal_heading: true  # Once inside xy_goal_tolerance the shim regains control and rotates in place to goal yaw with deterministic P+accel-limited primitive (no MPPI creep).
      angular_dist_threshold: 0.35  # ~20deg, AGGRESSIVE 1.05->0.35. Forward-lidar requirement: robot must be ALMOST face-aligned with path before MPPI takes travel. Combined with vy_max collapse (below), this makes start travel essentially forward-only.
      angular_disengage_threshold: 0.20  # ~11deg, 0.35->0.20. Only hand back to MPPI when robot is tightly aligned with path.
      forward_sampling_distance: 0.5  # Path sample distance for the start-rotation heading estimate.
      rotate_to_heading_angular_vel: 0.8  # 1.4->0.8 rad/s. Real-robot bag: wz commands saturated at 1.5 but actual yaw barely changed (~36deg over 226s). High commanded wz wasn't being realized — back off to a value the base + FASTLIO2 odom can actually track.
      max_angular_accel: 1.2  # 2.5->1.2 rad/s^2. Gentler ramp matches the reduced rotate_to_heading_angular_vel and avoids commanding angular accel the base can't track.
      simulate_ahead_time: 1.0  # Collision-check horizon (s) while the shim rotates in place.
      # --- Primary controller (MPPI) parameters: live at this same level per Nav2 rotation-shim convention ---
      time_steps: 20  # 24->20. With batch 250 below, total rollout states = 5000 (was 9600) which fits Jetson Orin 15Hz budget.
      model_dt: 0.1  # 20 steps * 0.1s = 2.0s lookahead
      batch_size: 250  # 400->250. Bag showed 50% controller_frequency miss rate at 400x24; 250x20 leaves compute headroom.
      vx_std: 0.2  # Standard deviation for forward velocity sampling (m/s); tune for exploration vs exploitation
      vy_std: 0.15  # 0.08->0.15. Allow lateral exploration for obstacle avoidance; PathAngleCritic + PreferForwardCritic (weights 12 + 12) still bias forward.
      wz_std: 0.25  # 0.3->0.25. Tighter sampling around the desired wz now that the base can't track aggressive rotations.
      vx_max: 0.26  # Maximum forward velocity (m/s); matches robot capability
      vx_min: 0.0  # 0->-0.26 disabled. Forward-only: reverse driving is blind because lidar only faces +x. Forces MPPI to plan forward-facing approaches.
      vy_max: 0.0  # DiffDrive ignores vy but set to 0 for clarity. No lateral capability — robot uses forward+rotate for navigation/avoidance.
      vy_min: 0.0
      wz_max: 0.9  # 1.5->0.9. Bag showed wz commands saturated at 1.5 but yaw barely changed — base can't track that fast. 0.9 matches what hardware actually realizes.
      ax_max: 0.6  # Maximum forward acceleration (m/s²); gentler for outdoor robot stability
      ax_min: -0.6  # Maximum forward deceleration (m/s²); smooth braking
      ay_max: 0.6  # Maximum lateral acceleration (m/s²); ENABLED for omnidirectional dynamics
      az_max: 1.2  # 2.5->1.2 for forward-compat. Real angular accel limit is velocity_smoother max_accel[2] (now 1.2).
      iteration_count: 1  # Number of MPPI iterations per control cycle; 1 is typically sufficient
      prune_distance: 1.5  # Distance (m) ahead on path to start trajectory optimization; larger = smoother far ahead
      transform_tolerance: 0.5  # 0.2->0.5. Real bag: "Lookup would require extrapolation into the future. Requested X but latest data at X-0.1s". FASTLIO2 publish jitter exceeds 0.2s window; 0.5s gives headroom (still investigate FASTLIO2 stamping/rate separately).
      motion_model: "Omni"  # Omnidirectional Ranger Mini V3.
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]  # PathAngleCritic + PreferForwardCritic RE-ADDED for forward-facing travel bias: the obstacle lidar only faces +x, so the robot must travel facing forward (not strafe/reverse blind). Both shut off inside threshold_to_consider 1.0 so they DON'T fight GoalAngleCritic's final in-place yaw alignment near the goal (that was the original reason PreferForwardCritic was removed; coordinated thresholds resolve it). Omni base + full vy retained — soft bias, not a lock. Sim-validated in nav2_sim.yaml.
      ConstraintCritic:  # Enforces kinematic and safety constraints
        enabled: true
        cost_power: 1  # Power order for constraint cost (linear)
        cost_weight: 4.0  # Weight for constraint violations; high priority for safety
      GoalCritic:  # Attracts robot to goal position
        enabled: true
        cost_power: 1
        cost_weight: 12.0  # Strong pull near goal; tested-working value.
        threshold_to_consider: 1.8  # Engage goal attraction at 1.8m so MPPI decelerates smoothly into xy_tol.
      GoalAngleCritic:  # Attracts robot to goal orientation
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        threshold_to_consider: 0.40  # 1.0->0.40. Defer goal-yaw alignment until robot is tightly inside the new xy_goal_tolerance (0.40) — lets PreferForwardCritic/PathAngleCritic keep robot facing path during transit, and the rotation shim does the actual final yaw.
      CostCritic:  # Uses costmap to avoid obstacles
        enabled: true
        cost_power: 2  # 1->2. Quadratic cost penalty: cells deep in the inflation gradient are punished MUCH harder, so MPPI commits to wider arcs around obstacles instead of skimming the inflation edge.
        cost_weight: 12.0  # 5->12. Match GoalCritic weight so the goal-pull can't dominate the obstacle-push (bag9 robot still hit obstacles with cost_weight 5).
        critical_cost: 253.0  # Reject trajectories at inscribed-radius cost.
        consider_footprint: true  # false->true. With DiffDrive motion model the MPPI rollouts are simpler so we can afford accurate footprint collision checks instead of relying purely on the inflation gradient. Rectangular footprint [0.7m x 0.5m] is small enough that the per-rollout cost remains tractable.
        collision_cost: 1000000.0
        near_goal_distance: 0.5
        trajectory_point_step: 3
      PathAlignCritic:  # Aligns velocity vector with path direction
        enabled: true
        cost_power: 1
        cost_weight: 8.0  # REDUCED from 10.0 - less aggressive so it doesn't fight with GoalAngleCritic
        max_path_occupancy_ratio: 0.05  # Fraction of path in collision before switching behavior
        trajectory_point_step: 4  # Check every 4th point for efficiency
        threshold_to_consider: 0.45  # Disable path alignment just before xy_tol handoff to rotation shim (0.40).
        offset_from_furthest: 20  # Look-ahead offset (indices) on path for alignment reference
        use_path_orientations: false  # Don't use path orientations (for holonomic planners)
      PathFollowCritic:  # Keeps robot close to path
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        offset_from_furthest: 5  # Look-ahead offset (indices) for path proximity reference
        threshold_to_consider: 0.45  # Match PathAlign.
      PathAngleCritic:  # Biases robot +x (chassis front + forward obstacle lidar) toward the path travel direction so it drives facing where it goes
        enabled: true
        cost_power: 1
        cost_weight: 12.0  # Heavy forward-facing bias during transit.
        offset_from_furthest: 4
        threshold_to_consider: 0.45  # Active until shim handoff (xy_tol 0.40).
        max_angle_to_furthest: 0.25  # rad (~14deg)
        forward_preference: true
      PreferForwardCritic:  # Penalizes reverse (-vx) so the forward-facing lidar leads
        enabled: true
        cost_power: 1
        cost_weight: 12.0
        threshold_to_consider: 0.45  # Active until shim handoff.

local_costmap:  # original: (none); Local rolling costmap configuration block.
  local_costmap:  # original: (none); Local rolling costmap configuration block.
    ros__parameters:  # original: (none); ROS 2 parameter namespace for this node; adjust values inside this block.
      update_frequency: 7.0  # 10->7. Free CPU for MPPI to hit 15Hz reliably; obstacles are slow-moving outdoor garden objects so 7Hz is sufficient.
      publish_frequency: 2.0  # 5->2. Costmap visualisation publish is not on the control hot path.
      global_frame: odom  # original: odom; Global frame used by this component; usually map for Nav2.
      robot_base_frame: base_footprint  # original: base_footprint; Robot base frame used for TF lookups; typically base_footprint or base_link.
      use_sim_time: False  # original: True; real robot uses system time.
      rolling_window: true  # original: true; Whether the costmap moves with the robot (true) or stays fixed.
      width: 8  # original: 3; larger local window for outdoor navigation.
      height: 8  # original: 3; larger local window for outdoor navigation.
      resolution: 0.05  # original: 0.05; Costmap resolution (m/cell); lower numbers capture finer detail.
      transform_tolerance: 0.5  # 0.3->0.5. Match controller transform_tolerance (FASTLIO2 TF jitter >0.3s).
      footprint: "[[0.35, 0.25], [0.35, -0.25], [-0.35, -0.25], [-0.35, 0.25]]"  # Rectangular footprint for Ranger Mini 3.0 (approx 0.7m x 0.5m)
      plugins: ["stvl_layer", "inflation_layer"]  # CHANGED to SpatioTemporalVoxelLayer for 3D LiDAR support.
      inflation_layer:  # original: (none); Inflation layer parameters; buffers obstacles outward.
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5  # 3.0->2.5. Gentler decay so MEDIUM cost extends further out, biasing MPPI to swing wider around obstacles. Combined with the larger radius below.
        inflation_radius: 0.80  # 0.55->0.80. Bag8: robot brushed an obstacle in transit. Footprint half-diagonal ~0.43m + 0.80m radius = ~37cm buffer past corner — comfortable margin given the forward-only lidar.
      stvl_layer:  # SpatioTemporalVoxelLayer for 3D obstacle detection from Livox Mid-360 LiDAR.
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"  # Recommended for 3D LiDARs (Nav2 tuning guide).
        enabled: True  # Enable this layer for real-time 3D obstacle detection.
        voxel_decay: 2.0  # Temporal decay: voxels expire after 2 seconds (good for dynamic obstacles like moving people/branches).
        decay_model: 0  # Linear decay model (0=linear, 1=exponential, 2=persistent); linear best for outdoor gardens.
        voxel_size: 0.05  # Voxel resolution (5cm); matches costmap resolution for consistency.
        track_unknown_space: true  # Track unexplored areas in the voxel grid.
        observation_persistence: 0.0  # Don't persist observations; rely on temporal decay to remove stale data.
        max_obstacle_height: 2.4  # Maximum height to consider as obstacle (2.4m); filters tree canopies and high branches.
        min_obstacle_height: 0.07  # Minimum height in odom frame (7cm); allows detection of small ground obstacles after TF transform.
        obstacle_range: 15.0  # Maximum detection range (15m); suitable for outdoor navigation.
        origin_z: -0.7  # Voxel grid origin offset (-0.7m); accounts for LiDAR mount height to capture ground-level obstacles.
        publish_voxel_map: false  # true->false. Voxel publish was eating CPU and contributing to the 50% controller_frequency miss. Re-enable only when debugging.
        transform_tolerance: 0.5  # 0.3->0.5. Match outer costmap + controller TF tolerance.
        mapping_mode: false  # Navigation mode (not mapping); set to true only when building initial maps.
        map_save_duration: 60.0  # Map save interval (60s); only used when mapping_mode is true.
        observation_sources: fastlio2_cloud  # Point cloud source: FASTLIO2 body cloud (current scan, not accumulated history).
        fastlio2_cloud:  # Configuration for FASTLIO2 body cloud observation source.
          data_type: PointCloud2  # Standard ROS 2 point cloud message type.
          topic: /fastlio2/body_cloud  # Topic: current LiDAR scan in fastlio2_body frame (NOT /fastlio2/world_cloud which is accumulated).
          marking: true  # Mark detected obstacles in the costmap.
          clearing: true  # Clear space using raycasting (remove obstacles when no longer detected).
          obstacle_range: 10.0  # Obstacle marking range (10m); focused on immediate surroundings for local avoidance.
          min_obstacle_height: -0.2  # Minimum height in fastlio2_body frame (-20cm); negative due to 45° LiDAR tilt, detects ground obstacles.
          max_obstacle_height: 2.0  # Maximum height in fastlio2_body frame (2m); focuses on robot-height obstacles, excludes high overhangs.
          expected_update_rate: 0.0  # Expected sensor rate (0 = no timeout check); FASTLIO2 publishes at variable rate ~10Hz.
          observation_persistence: 0.0  # Don't persist observations; use voxel_decay for temporal filtering instead.
          inf_is_valid: false  # Treat infinite range readings as invalid (common with LiDAR in open areas).
          clear_after_reading: true  # Clear observation buffer after processing to avoid duplicate insertions.
          voxel_filter: true  # Enable voxel filtering for sparse 3D LiDAR data (reduces noise from Livox scanning pattern).
          enabled: true  # Enable this observation source for active obstacle detection.
      always_send_full_costmap: False  # True->False on local costmap: cuts publish-side CPU; controllers use the raw service, not the published topic.

global_costmap:  # original: (none); Global planning costmap configuration block.
  global_costmap:  # original: (none); Global planning costmap configuration block.
    ros__parameters:  # original: (none); ROS 2 parameter namespace for this node; adjust values inside this block.
      update_frequency: 1.0  # original: 1.0; Update loop frequency for this costmap.
      publish_frequency: 1.0  # original: 1.0; Publish frequency for this costmap topic.
      global_frame: map  # original: map; Global frame used by this component; usually map for Nav2.
      robot_base_frame: base_footprint  # original: base_footprint; Robot base frame used for TF lookups; typically base_footprint or base_link.
      use_sim_time: False  # original: True; global costmap uses real time.
      footprint: "[[0.35, 0.25], [0.35, -0.25], [-0.35, -0.25], [-0.35, 0.25]]"  # Rectangular footprint for Ranger Mini 3.0 (approx 0.7m x 0.5m)
      resolution: 0.05  # original: 0.05; coarser but efficient global map for large outdoor areas.
      track_unknown_space: true  # original: true; Treat unknown cells as occupied so planner skirts unmapped space.
      rolling_window: false  # original: false; Whether the costmap moves with the robot (true) or stays fixed.; Use static map from Octomap projection
      width: 100  # original: 100; Total width (m) of the costmap area.; Large outdoor area coverage (100m x 100m)
      height: 100  # original: 100; Total height (m) of the costmap area.
      origin_x: -50.0  # original: -50.0; X origin (m) of the global costmap in its frame.; Center the costmap around the origin
      origin_y: -50.0  # original: -50.0; Y origin (m) of the global costmap in its frame.
      plugins: ["static_layer", "inflation_layer"]  # Global costmap uses only static map + inflation (no real-time sensors).
      static_layer:  # Static map layer: provides pre-built environment map for long-range path planning.
        plugin: "nav2_costmap_2d::StaticLayer"  # Standard static map plugin for Nav2.
        map_subscribe_transient_local: True  # Use transient_local QoS to receive latched map even after startup.
        map_topic: /projected_map  # Subscribe to Octomap Server's 2D projection (not /map); continuously updated 3D → 2D map.
        subscribe_to_updates: True  # Allow incremental map updates from Octomap Server during navigation.
        first_map_only: False  # Accept map updates continuously (not just first map); allows map refinement during operation.
      inflation_layer:  # Inflation layer: creates safety buffer around obstacles for path planning.
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5  # 3.0->2.5. Match local inflation for consistent gradient between planner and controller.
        inflation_radius: 0.60  # 0.2->0.60. Was way too tight: 0.20m << footprint half-diag (0.43m) meant the global planner could route through cells where the robot doesn't fit. 0.60m gives planner real clearance.
      always_send_full_costmap: True  # original: True; Publish the entire costmap each cycle instead of tiles.

planner_server:  # original: (none); Global planner server configuration block.
  ros__parameters:  # original: (none); ROS 2 parameter namespace for this node; adjust values inside this block.
    expected_planner_frequency: 20.0  # original: 20.0; Desired global planner run frequency.
    use_sim_time: False  # original: True; planner runs on real-time hardware clock.
    planner_plugins: ["GridBased"]  # original: ["GridBased"]; List of planner plugins to load.
    GridBased:  # original: (none); Smac Planner 2D for omnidirectional robot.
      plugin: "nav2_smac_planner/SmacPlanner2D"  # CHANGED from NavfnPlanner to Smac2D for better cost-awareness.
      tolerance: 0.25  # original: 0.5; Tighter tolerance for precise navigation.
      downsample_costmap: false  # Use full resolution costmap for accurate planning.
      downsampling_factor: 1  # No downsampling when downsample_costmap is false.
      allow_unknown: true  # original: true; Allow planner to traverse unknown cells if true.
      max_iterations: 1000000  # Maximum search iterations before giving up.
      max_on_approach_iterations: 1000  # Max iterations when close to goal.
      max_planning_time: 5.0  # Maximum planning time in seconds (generous for outdoor).
      motion_model_for_search: "MOORE"  # 8-connected grid for omnidirectional motion (vs 4-connected).
      # NOTE: angle_quantization_bins / analytic_expansion_* / minimum_turning_radius /
      # reverse_penalty / change_penalty / non_straight_penalty are SmacPlannerHybrid
      # parameters. SmacPlanner2D (a holonomic grid planner) silently ignores them, so
      # they were removed to avoid implying car-like behavior on this omni base.
      cost_penalty: 2.0  # Penalty weight for high-cost areas (respects inflation).
      retrospective_penalty: 0.015  # Penalty for retrospective search.
      lookup_table_size: 20.0  # Size of lookup table for heuristics.
      cache_obstacle_heuristic: false  # Don't cache for dynamic garden environment.
      smooth_path: true  # Enable path smoothing for better trajectories.

smoother_server:  # original: (none); Path smoother server configuration block.
  ros__parameters:  # original: (none); ROS 2 parameter namespace for this node; adjust values inside this block.
    use_sim_time: False  # original: True; smoother uses hardware time.
    smoother_plugins: ["simple_smoother"]  # original: ["simple_smoother"]; List of smoother plugins to load.
    simple_smoother:  # original: (none); Simple smoother parameters.
      plugin: "nav2_smoother::SimpleSmoother"  # original: "nav2_smoother::SimpleSmoother"; Fully qualified plugin class implementing this capability.
      tolerance: 1.0e-10  # original: 1.0e-10; Planner goal tolerance (m); increase for easier goal acceptance.
      max_its: 1000  # original: 1000; Maximum iterations smoothing algorithm can run.
      do_refinement: True  # original: True; Run additional refinement pass when true.

behavior_server:  # original: (none); Recoveries/behaviors server configuration block.
  ros__parameters:  # original: (none); ROS 2 parameter namespace for this node; adjust values inside this block.
    costmap_topic: local_costmap/costmap_raw  # original: local_costmap/costmap_raw; Topic name supplying local costmap data to behaviors.
    footprint_topic: local_costmap/published_footprint  # original: local_costmap/published_footprint; Topic name for robot footprint published to behaviors.
    cycle_frequency: 10.0  # original: 10.0; Frequency for running recovery behaviors.
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]  # original: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]; List of behavior plugins available.
    spin:  # original: (none); Spin behavior configuration block.
      plugin: "nav2_behaviors/Spin"  # original: "nav2_behaviors/Spin"; Fully qualified plugin class implementing this capability.
    backup:  # original: (none); Backup behavior configuration block.
      plugin: "nav2_behaviors/BackUp"  # original: "nav2_behaviors/BackUp"; Fully qualified plugin class implementing this capability.
    drive_on_heading:  # original: (none); Drive-on-heading behavior configuration block.
      plugin: "nav2_behaviors/DriveOnHeading"  # original: "nav2_behaviors/DriveOnHeading"; Fully qualified plugin class implementing this capability.
    wait:  # original: (none); Wait behavior configuration block.
      plugin: "nav2_behaviors/Wait"  # original: "nav2_behaviors/Wait"; Fully qualified plugin class implementing this capability.
    assisted_teleop:  # original: (none); Assisted teleoperation behavior configuration block.
      plugin: "nav2_behaviors/AssistedTeleop"  # original: "nav2_behaviors/AssistedTeleop"; Fully qualified plugin class implementing this capability.
    global_frame: map  # original: odom; behaviors operate in global map frame to match Nav2.
    robot_base_frame: base_footprint  # original: base_footprint; Robot base frame used for TF lookups; typically base_footprint or base_link.
    transform_tolerance: 0.3  # original: 0.1; slightly more tolerant TF timing.
    use_sim_time: False  # original: true; real robot uses system time.
    simulate_ahead_time: 2.5  # original: 2.0; simulate behaviors slightly further ahead.
    max_rotational_vel: 1.0  # original: 1.0; allow somewhat faster spins.
    min_rotational_vel: 0.2  # original: 0.4; allow slower, more precise rotations.
    rotational_acc_lim: 2.5  # original: 3.2; gentler rotational acceleration.

robot_state_publisher:  # original: (none); Robot State Publisher node configuration.
  ros__parameters:  # original: (none); ROS 2 parameter namespace for this node; adjust values inside this block.
    use_sim_time: False  # original: True; robot TF on hardware uses wall-clock time.

waypoint_follower:  # original: (none); Waypoint follower node configuration block.
  ros__parameters:  # original: (none); ROS 2 parameter namespace for this node; adjust values inside this block.
    use_sim_time: False  # original: True; follow waypoints in real time on hardware.
    loop_rate: 20  # original: 20; Loop frequency for executing waypoint tasks.
    stop_on_failure: false  # original: false; Stop the mission when any waypoint task fails.
    waypoint_task_executor_plugin: "wait_at_waypoint"  # original: "wait_at_waypoint"; Plugin invoked at each waypoint for extra behavior.
    wait_at_waypoint:  # original: (none); Parameters for wait-at-waypoint executor.
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"  # original: "nav2_waypoint_follower::WaitAtWaypoint"; Fully qualified plugin class implementing this capability.
      enabled: True  # original: True; Enable/disable this block without removing it.
      waypoint_pause_duration: 200  # original: 200; Time (s) to pause at each waypoint when using wait executor.

velocity_smoother:  # original: (none); Velocity smoother node configuration block.
  ros__parameters:  # original: (none); ROS 2 parameter namespace for this node; adjust values inside this block.
    use_sim_time: False  # original: True; smoothing runs on real-time hardware clock.
    smoothing_frequency: 20.0  # original: 20.0; How fast the smoother filters incoming cmd_vel.
    scale_velocities: False  # original: False; Scale commands proportionally when smoothing rather than clipping.
    feedback: "OPEN_LOOP"  # original: "OPEN_LOOP"; Feedback mode; OPEN_LOOP ignores odom while CLOSED_LOOP tracks it.
    max_velocity: [0.26, 0.18, 0.9]  # vy matches MPPI.
    min_velocity: [0.0, -0.18, -0.9]  # vx_min 0: no reverse driving (blind lidar).
    max_accel: [0.8, 0.6, 1.2]
    max_decel: [-0.8, -0.6, -1.2]
    odom_topic: "/fastlio2/lio_odom"  # original: odom; align smoothing with FASTLIO2 odometry.
    odom_duration: 0.1  # original: 0.1; Time window of odom data kept for smoothing.
    deadband_velocity: [0.02, 0.05, 0.02]  # vy 0.10->0.05. The 0.10 deadband killed obstacle-avoidance strafe in transit (bag7 ran into an obstacle). 0.05 still suppresses MPPI's micro-residual vy during near-goal oscillation (so base stays SPINNING for the rotation-shim handoff) but lets MPPI's real avoidance strafes (>0.05 m/s) through. Rotation shim sends exactly vy=0 so it's unaffected. Root bug is upstream in ranger_messenger.cpp: ANY vy!=0 → PARALLEL mode → wz DROPPED. Bench tests (A wz=0.5/B wz=1.0) rotated 22-36 deg/s ✓; mixed vy+wz rotated 0 deg/s ✗.
    velocity_timeout: 1.0  # original: 1.0; Timeout (s) after which commands decay to zero if none received.
