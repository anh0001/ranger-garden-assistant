octomap_server:
  ros__parameters:
    # HIGH‑LEVEL BEHAVIOR
    # OctoMap clears space only along rays from the sensor to each measured point.
    # Voxels that are never traversed by a ray (e.g. behind walls/ground or far away)
    # will not be cleared, which can look like "stuck" obstacles at long range.

    # QoS for point‑cloud input.
    # Only change if you deliberately relax reliability or history to match the publisher.
    qos_overrides:
      /cloud_in:
        subscription:
          reliability: reliable
          durability: volatile
          history: keep_last
          depth: 5
    # Fallback QoS used by octomap_server2 if overrides are ignored.
    cloud_in_reliability: reliable
    cloud_in_history_depth: 5

    # World frame in which the 3D map lives.
    # Keep as 'map' for Nav2; change only if your static layer uses a different global frame.
    frame_id: map

    # Robot base frame used for ground‑plane detection when filter_ground is true.
    # Must match the TF frame directly under odom (usually base_footprint).
    base_frame_id: base_footprint

    # OCTREE RESOLUTION
    # Size of each voxel in meters.
    # Lower (e.g. 0.1)  => sharper obstacles, higher CPU/memory.
    # Higher (e.g. 0.2) => smoother map, faster, but thin obstacles may disappear.
    resolution: 0.1

    # VISUALIZATION
    # Color occupied voxels by height (purely visual; does not affect Nav2).
    # Cannot be used together with colored_map.
    height_map: true

    # Use RGB from the point cloud for voxel colors (requires COLOR_OCTOMAP_SERVER build flag).
    # Mutually exclusive with height_map.
    colored_map: false

    # Color scaling factor for height‑based visualization (0.0‑1.0).
    color_factor: 0.8

    # GROUND / NOISE FILTERING
    # Enable RANSAC‑based ground plane detection.
    # Ground points are used only to clear free space, not to mark obstacles.
    # Disable if your ground is not approximately flat or TF for base_frame_id is unreliable.
    filter_ground: true

    # Remove isolated occupied voxels with no occupied neighbors.
    # Enable to reduce salt‑and‑pepper noise; disable if you need to keep very small isolated obstacles.
    filter_speckles: true

    # MAP COMPRESSION & UPDATE STRATEGY
    # Merge identical child nodes to save memory (slightly more CPU when updating).
    compress_map: true

    # If true, only changed regions of the 2D projected map are updated.
    # Set to false if you suspect incremental updates leave stale cells, at the cost of more CPU.
    incremental_2D_projection: true

    # Also publish explicit free‑space voxels for visualization.
    # Not needed for Nav2 and increases bandwidth.
    publish_free_space: false

    # SENSOR MODEL (PROBABILISTIC UPDATES)
    # P(hit): assumed occupancy probability when a measurement hits a voxel (must be > 0.5).
    # Increase if obstacles look too "thin" or disappear quickly; decrease if dynamic obstacles linger too long.
    sensor_model/hit: 0.65

    # P(miss): assumed occupancy after seeing free space (must be < 0.5).
    # Lower => clears obstacles faster when you see through them; higher => more conservative clearing.
    sensor_model/miss: 0.1

    # Lower clamp for voxel occupancy probability.
    # Closer to 0.0 => voxels can become very confidently free (need more hits to become occupied again).
    # Closer to 0.5 => free space is less "certain", so obstacles can re‑appear with fewer new hits.
    sensor_model/min: 0.04

    # Upper clamp for voxel occupancy probability.
    # Closer to 1.0 => obstacles are very "sticky" and take many misses to clear.
    # Lower this if old obstacles remain in the map for too long.
    sensor_model/max: 0.5

    # POINT‑CLOUD CROP (APPLIED BEFORE INSERTION)
    # Minimum Z of accepted points (meters).
    # With filter_ground=true this is evaluated in base_frame_id; otherwise in the map frame.
    # Raise to ignore very low returns (ground clutter, robot chassis); lower if low obstacles disappear.
    pointcloud_min_z: -0.1

    # Maximum Z of accepted points (meters).
    # Lower to drop ceiling/trees; raise to keep high walls and overhangs in the 3D map.
    pointcloud_max_z: 2.5  # Chosen to keep ceiling/wall returns in ~2.4 m corridors and outdoor canopy.

    # Horizontal crop in X (meters).
    # Tighten these limits if you want to ignore very distant points or parts of the scan behind the robot.
    pointcloud_min_x: -20.0

    pointcloud_max_x: 20.0

    pointcloud_min_y: -20.0

    pointcloud_max_y: 20.0

    # 2D OCCUPANCY PROJECTION (USED BY NAV2 STATIC LAYER)
    # Voxels outside this Z‑band are ignored when building /projected_map.
    # Raise occupancy_min_z if floor roughness appears as obstacles; lower if very low obstacles are missing.
    occupancy_min_z: 0.05

    # Lower occupancy_max_z if ceiling or tree canopy shows up as obstacles; raise if tall obstacles are cut off.
    occupancy_max_z: 1.5  # Keeps people/branches, but drops ceiling voxels (~2.4 m corridors).

    # MINIMUM 2D MAP SIZE (PADDING AROUND ROBOT)
    # If the explored map is smaller than this, OctoMap pads the 2D grid to at least this width/height.
    # Increase if you want Nav2's global costmap to always cover a larger area around the robot.
    min_x_size: 20.0

    min_y_size: 20.0

    # GROUND PLANE (RANSAC) TUNING
    # Maximum distance from the fitted plane for a point to be treated as ground (meters).
    # Increase if uneven ground is not detected as ground; decrease if low obstacles are being removed as ground.
    ground_filter/distance: 0.05

    # Maximum tilt from vertical for a plane to count as ground (radians).
    # Increase if you drive on ramps/slopes; decrease if walls are mis‑detected as ground.
    ground_filter/angle: 0.15

    # Maximum distance of the plane from z=0 to still count as "ground" (meters).
    # Increase if your ground is offset in z (e.g. mis‑aligned base_link); decrease if overhead surfaces are classified as ground.
    ground_filter/plane_distance: 0.1

    # SENSOR RANGE LIMIT
    # Maximum range for raycasting (meters).
    # -1.0 = unlimited (use all points). Reduce if you want to ignore very distant returns or reduce map size.
    sensor_model/max_range: 30.0

    # VISUALIZATION COLORS (RGBA, 0.0‑1.0) FOR OCCUPIED VOXELS
    color/r: 0.2

    color/g: 0.4

    color/b: 1.0

    # Alpha (1.0 = fully opaque).
    color/a: 1.0

    # VISUALIZATION COLORS FOR FREE SPACE (only used if publish_free_space is true)
    color_free/r: 0.0

    color_free/g: 0.7

    color_free/b: 0.2

    # Alpha (e.g. 0.3 = semi‑transparent).
    color_free/a: 0.3
